name: Step 5 # Setup the React presentation tier

on:
  push:
    branches:
      - "build-octofit-app"

env:
  STEP_6_FILE: ".github/steps/6-copilot-on-github.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    permissions:
      contents: read
      issues: read
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.0

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.0

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v3
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: github-actions[bot]
          body-includes: "<!-- skills-step-feedback -->"
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: .github/step-feedback/checking-work.md
          edit-mode: replace

      # START: Check practical exercise

      - name: Check frontend dependencies
        id: check-dependencies
        continue-on-error: true
        run: node .github/scripts/grade-step.mjs step5-dependencies

      - name: Check required React components
        id: check-components
        continue-on-error: true
        run: node .github/scripts/grade-step.mjs step5-components

      - name: Check routing and API configuration
        id: check-api-config
        continue-on-error: true
        run: node .github/scripts/grade-step.mjs step5-api-config

      - name: Install frontend dependencies
        id: install-frontend
        continue-on-error: true
        run: npm install --prefix octofit-tracker/frontend --ignore-scripts

      - name: Build frontend
        id: build-frontend
        if: steps.install-frontend.outcome == 'success'
        continue-on-error: true
        run: npm run build --prefix octofit-tracker/frontend

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: .github/step-feedback/step-results-table.md
          vars: |
            step_number: 5
            results_table:
              - description: "Check React Router and Bootstrap dependencies"
                passed: ${{ steps.check-dependencies.outcome == 'success' }}
              - description: "Check required React components"
                passed: ${{ steps.check-components.outcome == 'success' }}
              - description: "Check routing and environment-aware API configuration"
                passed: ${{ steps.check-api-config.outcome == 'success' }}
              - description: "Build the React application"
                passed: ${{ steps.build-frontend.outcome == 'success' }}

      # END: Check practical exercise

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.0

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 6

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_6_FILE }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{github.workflow}}"
          gh workflow enable "Step 6"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
