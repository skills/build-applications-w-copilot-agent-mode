name: Step 6 # Copilot on GitHub

on:
  pull_request:
    branches:
      - main
    paths:
      - "octofit-tracker/**"
    types:
      - closed

env:
  REVIEW_FILE: ".github/steps/x-review.md"

jobs:
  find_exercise:
    if: github.event.pull_request.merged == true
    name: Find Exercise Issue
    permissions:
      contents: read
      issues: read
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.0

  validate_application:
    if: github.event.pull_request.merged == true
    name: Validate completed application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout merged application
        uses: actions/checkout@v6

      - name: Validate exercise structure
        run: node .github/scripts/validate-exercise.mjs

      - name: Validate learner outcomes
        run: |
          for check in \
            step2-react step2-express step2-mongoose \
            step3-database step3-models step3-seed step3-routes \
            step4-hosting step4-api \
            step5-dependencies step5-components step5-api-config
          do
            node .github/scripts/grade-step.mjs "$check"
          done

      - name: Install application dependencies
        run: |
          npm install --prefix octofit-tracker/backend --ignore-scripts
          npm install --prefix octofit-tracker/frontend --ignore-scripts

      - name: Build application tiers
        run: |
          npm run build --prefix octofit-tracker/backend
          npm run build --prefix octofit-tracker/frontend

  post_review_content:
    name: Post review content
    needs: [find_exercise, validate_application]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.0

      - name: Create comment - step finished - final review next
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/lesson-review.md

      - name: Create comment - add review content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}

      - name: Disable current workflow
        run: gh workflow disable "${{github.workflow}}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Finish Exercise
    needs: [find_exercise, validate_application, post_review_content]
    permissions:
      contents: write
      issues: write
    uses: skills/exercise-toolkit/.github/workflows/finish-exercise.yml@v0.9.0
    with:
      issue-url: ${{ needs.find_exercise.outputs.issue-url }}
      exercise-title: "Build Applications with GitHub Copilot Agent Mode"
