name: Step 2

on:
  workflow_dispatch:
  push:
    branches:
      - "build-octofit-app"
    paths:
      - "octofit-tracker/backend/src/models/**"
      - "octofit-tracker/backend/src/scripts/**"
      - "octofit-tracker/backend/tests/data.contract.test.ts"

permissions: {}

env:
  STEP_3_FILE: ".github/steps/3-step.md"

jobs:
  find_exercise:
    name: Localizar issue do exercício
    permissions:
      issues: read
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    name: Verificar trabalho da etapa
    runs-on: ubuntu-latest
    needs: [find_exercise]
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
      - name: Baixar toolkit do exercício
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3
      - name: Localizar comentário mais recente
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: "github-actions[bot]"
          body-regex: 'acompanhando seu progresso|Seu progresso já está aparecendo|## Etapa \d+ — (concluída|precisa de ajustes)'
          direction: last
      - name: Atualizar comentário - verificar trabalho
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: .github/templates/feedback/checking-work.md
          edit-mode: replace
      - name: Instalar dependências do backend
        id: install_backend
        continue-on-error: true
        run: npm ci --prefix octofit-tracker/backend
      - name: Executar testes da camada de dados
        id: data_tests
        continue-on-error: true
        run: node .github/scripts/grade-step.mjs contract-data
      - name: Validar implementação da camada de dados
        id: data_static
        continue-on-error: true
        run: node .github/scripts/grade-step.mjs step2-data
      - name: Atualizar comentário - resultado da etapa
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: .github/templates/feedback/step-results-table.md
          vars: |
            step_number: 2
            results_table:
              - description: "Instalar dependências do backend"
                passed: ${{ steps.install_backend.outcome == 'success' }}
              - description: "Executar testes da camada de dados"
                passed: ${{ steps.data_tests.outcome == 'success' }}
              - description: "Validar implementação da camada de dados"
                passed: ${{ steps.data_static.outcome == 'success' }}
      - name: Falhar se alguma verificação não passar
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Publicar conteúdo da próxima etapa
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
      - name: Baixar toolkit do exercício
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3
      - name: Publicar comentário - etapa concluída
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/templates/feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 3
      - name: Publicar comentário - conteúdo da etapa
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_3_FILE }}
      - name: Publicar comentário - acompanhar progresso
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/templates/feedback/watching-for-progress.md
      - name: Desativar workflow atual e ativar o próximo
        run: |
          gh workflow disable "${{github.workflow}}"
          gh workflow enable "Step 3"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
