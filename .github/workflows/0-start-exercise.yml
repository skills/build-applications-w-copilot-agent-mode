name: Step 0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

env:
  STEP_1_FILE: ".github/steps/1-step.md"

jobs:
  start_exercise:
    if: |
      !github.event.repository.is_template
    name: Iniciar exercício
    permissions:
      contents: write
      actions: write
      issues: write
    uses: skills/exercise-toolkit/.github/workflows/start-exercise.yml@v0.9.3
    with:
      exercise-title: "Construa e teste uma aplicação multicamadas com o GitHub Copilot"
      intro-message: "Use o modo agent do Copilot para implementar o OctoFit Tracker com base nas notas de arquitetura e nos testes executáveis."

  post_next_step_content:
    name: Publicar conteúdo da próxima etapa
    runs-on: ubuntu-latest
    needs: [start_exercise]
    permissions:
      contents: read
      actions: write
      issues: write
    env:
      ISSUE_NUMBER: ${{ needs.start_exercise.outputs.issue-number }}
      ISSUE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Baixar toolkit do exercício
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3
      - name: Publicar comentário - conteúdo da etapa
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_1_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}
      - name: Publicar comentário - acompanhar progresso
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/templates/feedback/watching-for-progress.md
      - name: Ativar workflow da próxima etapa
        run: gh workflow enable "Step 1"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
