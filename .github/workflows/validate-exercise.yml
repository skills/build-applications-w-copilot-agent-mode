name: Validar exercício

on:
  pull_request:
    paths:
      - ".github/**"
      - ".devcontainer/**"
      - ".vscode/**"
      - "README.md"
      - "docs/**"
      - "tests/**"
      - "octofit-tracker/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - ".devcontainer/**"
      - ".vscode/**"
      - "README.md"
      - "docs/**"
      - "tests/**"
      - "octofit-tracker/**"

permissions: {}

jobs:
  validate:
    name: Validar metadados e estrutura do exercício
    # Maintainer-only: learner copies are not templates and are graded by the step workflows instead.
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
      - name: Validar estrutura do exercício
        run: node .github/scripts/validate-exercise.mjs
      - name: Executar fixtures de validação
        run: node --test tests/exercise-validation.test.mjs
      - name: Instalar dependências do backend
        run: npm ci --prefix octofit-tracker/backend
      - name: Instalar dependências do frontend
        run: npm ci --prefix octofit-tracker/frontend
      - name: Compilar o scaffold inicial
        run: |
          npm run build --prefix octofit-tracker/backend
          npm run build --prefix octofit-tracker/frontend
