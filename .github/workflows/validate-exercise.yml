name: Validate Exercise

on:
  pull_request:
    paths:
      - ".github/**"
      - "README.md"
      - "docs/exercise-validation.md"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "README.md"
      - "docs/exercise-validation.md"
      - "tests/**"

jobs:
  validate:
    name: Validate exercise metadata and fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate exercise structure
        run: node .github/scripts/validate-exercise.mjs

      - name: Run negative validation fixtures
        run: node --test tests/exercise-validation.test.mjs
