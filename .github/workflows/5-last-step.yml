name: Step 5

on:
  pull_request:
    branches:
      - main
    paths:
      - "octofit-tracker/**"
      - "docs/architecture.md"
    types:
      - closed

permissions: {}

env:
  REVIEW_FILE: ".github/steps/x-review.md"

jobs:
  find_exercise:
    if: github.event.pull_request.merged == true
    name: Find Exercise Issue
    permissions:
      issues: read
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    if: github.event.pull_request.merged == true
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3
      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: "github-actions[bot]"
          body-regex: 'watch your progress in the background|Looks like you are making progress|## Step \d+ - (Passed|Fail)'
          direction: last
      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace
      - name: Install backend dependencies
        id: install_backend
        continue-on-error: true
        run: npm ci --prefix octofit-tracker/backend
      - name: Install frontend dependencies
        id: install_frontend
        continue-on-error: true
        run: npm ci --prefix octofit-tracker/frontend
      - name: Run final grading checks
        id: final_checks
        continue-on-error: true
        run: node .github/scripts/grade-step.mjs step5-final
      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 5
            results_table:
              - description: "Install backend dependencies"
                passed: ${{ steps.install_backend.outcome == 'success' }}
              - description: "Install frontend dependencies"
                passed: ${{ steps.install_frontend.outcome == 'success' }}
              - description: "Run final grading checks"
                passed: ${{ steps.final_checks.outcome == 'success' }}
      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_review_content:
    if: github.event.pull_request.merged == true
    name: Post review content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3
      - name: Create comment - step finished - final review next
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/lesson-review.md
      - name: Create comment - add review content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}
      - name: Disable current workflow
        run: gh workflow disable "${{github.workflow}}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    if: github.event.pull_request.merged == true
    name: Finish Exercise
    needs: [find_exercise, post_review_content]
    permissions:
      contents: write
      issues: write
    uses: skills/exercise-toolkit/.github/workflows/finish-exercise.yml@v0.9.3
    with:
      issue-url: ${{ needs.find_exercise.outputs.issue-url }}
      exercise-title: "Build and test a multi-tier application with GitHub Copilot"
