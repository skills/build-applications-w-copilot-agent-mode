name: Step 5

on:
  pull_request:
    branches:
      - main
    paths:
      - "octofit-tracker/**"
      - "docs/architecture.md"
    types:
      - closed

permissions: {}

env:
  REVIEW_FILE: ".github/steps/x-review.md"

jobs:
  find_exercise:
    if: github.event.pull_request.merged == true
    name: Localizar issue do exercício
    permissions:
      issues: read
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    if: github.event.pull_request.merged == true
    name: Verificar trabalho da etapa
    runs-on: ubuntu-latest
    needs: [find_exercise]
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
      - name: Baixar toolkit do exercício
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3
      - name: Localizar comentário mais recente
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: "github-actions[bot]"
          body-regex: 'acompanhando seu progresso|Seu progresso já está aparecendo|## Etapa \d+ — (concluída|precisa de ajustes)'
          direction: last
      - name: Atualizar comentário - verificar trabalho
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: .github/templates/feedback/checking-work.md
          edit-mode: replace
      - name: Instalar dependências do backend
        id: install_backend
        continue-on-error: true
        run: npm ci --prefix octofit-tracker/backend
      - name: Instalar dependências do frontend
        id: install_frontend
        continue-on-error: true
        run: npm ci --prefix octofit-tracker/frontend
      - name: Executar verificações finais
        id: final_checks
        continue-on-error: true
        run: node .github/scripts/grade-step.mjs step5-final
      - name: Atualizar comentário - resultado da etapa
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: .github/templates/feedback/step-results-table.md
          vars: |
            step_number: 5
            results_table:
              - description: "Instalar dependências do backend"
                passed: ${{ steps.install_backend.outcome == 'success' }}
              - description: "Instalar dependências do frontend"
                passed: ${{ steps.install_frontend.outcome == 'success' }}
              - description: "Executar verificações finais"
                passed: ${{ steps.final_checks.outcome == 'success' }}
      - name: Falhar se alguma verificação não passar
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_review_content:
    if: github.event.pull_request.merged == true
    name: Publicar revisão final
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
      - name: Baixar toolkit do exercício
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3
      - name: Publicar comentário - preparar revisão final
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/templates/feedback/lesson-review.md
      - name: Publicar comentário - conteúdo da revisão
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}
      - name: Desativar workflow atual
        run: gh workflow disable "${{github.workflow}}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    if: github.event.pull_request.merged == true
    name: Concluir exercício
    needs: [find_exercise, post_review_content]
    permissions:
      contents: write
      issues: write
    uses: skills/exercise-toolkit/.github/workflows/finish-exercise.yml@v0.9.3
    with:
      issue-url: ${{ needs.find_exercise.outputs.issue-url }}
      exercise-title: "Construa e teste uma aplicação multicamadas com o GitHub Copilot"
