name: Step 3 # Logic tier setup and MongoDB test data population

on:
  push:
    branches:
      - "build-octofit-app"

env:
  STEP_4_FILE: ".github/steps/4-setup-django-rest-framework.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    permissions:
      contents: read
      issues: read
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.0

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.0

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v3
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: github-actions[bot]
          body-includes: "<!-- skills-step-feedback -->"
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: .github/step-feedback/checking-work.md
          edit-mode: replace

      # START: Check practical exercise
      - name: Check database config file for octofit_db
        id: check-octofit-db
        continue-on-error: true
        run: node .github/scripts/grade-step.mjs step3-database

      - name: Check Mongoose models
        id: check-models
        continue-on-error: true
        run: node .github/scripts/grade-step.mjs step3-models

      - name: Check seed script description
        id: check-seed-script
        continue-on-error: true
        run: node .github/scripts/grade-step.mjs step3-seed

      - name: Check API routes
        id: check-api-routes
        continue-on-error: true
        run: node .github/scripts/grade-step.mjs step3-routes

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: .github/step-feedback/step-results-table.md
          vars: |
            step_number: 3
            results_table:
              - description: "Check database.ts for octofit_db"
                passed: ${{ steps.check-octofit-db.outcome == 'success' }}
              - description: "Check Mongoose models for all resources"
                passed: ${{ steps.check-models.outcome == 'success' }}
              - description: "Check seed.ts populates realistic data"
                passed: ${{ steps.check-seed-script.outcome == 'success' }}
              - description: "Check API routes for all resources"
                passed: ${{ steps.check-api-routes.outcome == 'success' }}

      # END: Check practical exercise

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.0

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 4

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_4_FILE }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{github.workflow}}"
          gh workflow enable "Step 4"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
